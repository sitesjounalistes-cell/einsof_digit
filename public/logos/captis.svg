<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <style>
      .cls-blue { fill: #0B1D3A; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 110px; letter-spacing: -3px; }
      .cls-red { fill: #DC2626; font-family: 'Montserrat', sans-serif; font-weight: 800; font-size: 110px; letter-spacing: -3px; }
      .cls-tagline { fill: #0B1D3A; font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 24px; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="100" r="160" fill="#FFFFFF" />

  <!-- CAPTIS text -->
  <text x="30" y="120" class="cls-blue">C</text>
  <text x="105" y="120" class="cls-red">a</text>
  <!-- The p descender goes down -->
  <text x="180" y="120" class="cls-blue">p</text>
  <text x="255" y="120" class="cls-blue">t</text>
  <!-- i without dot -->
  <text x="305" y="120" class="cls-blue">ı</text>
  
  <!-- Red diamond for 'i' -->
  <g transform="translate(322, 40)">
    <polygon points="0,-12 12,0 0,12 -12,0" fill="#DC2626" />
    <polygon points="0,-12 12,0 0,12 -12,0" fill="none" stroke="#0B1D3A" stroke-width="2" />
  </g>

  <text x="335" y="120" class="cls-blue">s</text>

  <!-- Tagline -->
  <text x="35" y="165" class="cls-tagline">Avec vous, sans limite</text>
</svg>
